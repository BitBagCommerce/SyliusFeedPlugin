name: Build

on:
    push:
        branches:
            - "master"
    pull_request: ~
    workflow_dispatch: ~

jobs:
    tests:
        runs-on: ubuntu-latest

        name: "Sylius ${{ matrix.sylius }}, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, MySQL ${{ matrix.mysql }}"

        strategy:
            fail-fast: false
            matrix:
                php: [ "8.3" ]
                symfony: [ "^7.4" ]
                sylius: [ "~2.3.0" ]
                mysql: [ "8.0" ]

        services:
            mysql:
                image: "mysql:${{ matrix.mysql }}"
                env:
                    MYSQL_ROOT_PASSWORD: root
                ports:
                    - 3306:3306
                options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

        env:
            APP_ENV: test
            DATABASE_URL: "mysql://root:root@127.0.0.1:3306/sylius?serverVersion=${{ matrix.mysql }}"

        steps:
            -   uses: actions/checkout@v4

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "${{ matrix.php }}"
                    extensions: intl, mbstring
                    coverage: none

            -   name: Get Composer cache directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            -   name: Cache Composer
                uses: actions/cache@v4
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}
                    restore-keys: |
                        ${{ runner.os }}-php-${{ matrix.php }}-composer-

            -   name: Restrict Symfony version
                run: |
                    composer global config --no-plugins allow-plugins.symfony/flex true
                    composer global require --no-progress --no-scripts --no-plugins "symfony/flex:^2.4"
                    composer config extra.symfony.require "${{ matrix.symfony }}"

            -   name: Restrict Sylius version
                run: composer require "sylius/sylius:${{ matrix.sylius }}" --dev --no-update --no-scripts --no-interaction

            -   name: Install PHP dependencies
                run: composer install --no-interaction

            -   name: Validate composer.json
                run: composer validate --ansi --strict --no-check-lock

            -   name: Lint YAML and Twig files
                run: |
                    vendor/bin/console lint:yaml src/Resources
                    vendor/bin/console lint:twig src/Resources

            -   name: Lint container
                run: vendor/bin/console lint:container

            -   name: Prepare test application database
                run: |
                    vendor/bin/console doctrine:database:create -vvv
                    vendor/bin/console doctrine:schema:create -vvv

            -   name: Validate database schema
                run: vendor/bin/console doctrine:schema:validate

            -   name: Run PHPSpec
                run: vendor/bin/phpspec run --no-interaction

            -   name: Run PHPUnit
                run: vendor/bin/phpunit --colors=always

            -   name: Run Behat
                run: vendor/bin/behat --colors --strict -vvv --no-interaction || vendor/bin/behat --colors --strict -vvv --no-interaction --rerun
